name: Tests

on:
  push:
    branches: [platypus_dev_1.3, main]
    paths:
      - 'tinyml-modelmaker/**'
      - 'tinyml-tinyverse/**'
      - 'tinyml-modelzoo/**'
      - 'tinyml-modeloptimization/**'
      - '.github/workflows/test-modelmaker.yml'
  pull_request:
    branches: [platypus_dev_1.3, main]
    paths:
      - 'tinyml-modelmaker/**'
      - 'tinyml-tinyverse/**'
      - 'tinyml-modelzoo/**'
      - 'tinyml-modeloptimization/**'
  workflow_dispatch:  # manual trigger

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Tests (${{ matrix.os }})
    # Windows support is experimental — don't block the overall run
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ti_mcu_nnc (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install "ti_mcu_nnc @ https://software-dl.ti.com/mctools/esd/tvm/mcu/ti_mcu_nnc-2.1.2-cp310-cp310-linux_x86_64.whl" || true

      - name: Install ti_mcu_nnc (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install "ti_mcu_nnc @ https://software-dl.ti.com/mctools/esd/tvm/mcu/ti_mcu_nnc-2.1.2-cp310-cp310-win_amd64.whl" || true

      - name: Install ti_mcu_nnc (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install "ti_mcu_nnc @ https://software-dl.ti.com/mctools/esd/tvm/mcu/ti_mcu_nnc-2.1.2-cp310-cp310-macosx_14_0_arm64.whl" || true

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          pip install -e tinyml-modelzoo
          pip install -e tinyml-tinyverse
          pip install -e "tinyml-modeloptimization/torchmodelopt"
          pip install -e tinyml-modelmaker --no-deps
          pip install defusedxml==0.7.1 "numpy==2.2.6" "PyYAML==6.0.3" "tqdm==4.67.1" "requests==2.32.5" "torch==2.7.1"
          pip install pytest

      - name: Tier 1 — Component Tests
        working-directory: tinyml-modelmaker
        run: python -m pytest tests/test_model_registry.py tests/test_config_validation.py -v --tb=short

      - name: Tier 3 — Cross-Device Validation
        working-directory: tinyml-modelmaker
        run: python -m pytest tests/test_cross_device.py -v --tb=short

      - name: Tier 2 — Pipeline Smoke Tests
        working-directory: tinyml-modelmaker
        run: python -m pytest tests/test_pipeline_smoke.py -v --tb=short

      # tinyml-tinyverse, tinyml-modelzoo, and torchmodelopt have no
      # equivalent of the Tier steps above -- until now, nothing ran their
      # tests/ directories in CI at all, so every regression test added
      # there was silently never checked on push/PR. Guarded with a
      # find-based existence check (rather than a plain `test -d tests`)
      # since an empty tests/ directory makes pytest exit non-zero with "no
      # tests collected", which would otherwise fail CI on packages that
      # temporarily have no tests.
      - name: tinyml-tinyverse Tests
        working-directory: tinyml-tinyverse
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest tests/ -v --tb=short
          else
            echo "No tests found in tinyml-tinyverse/tests/ yet -- skipping."
          fi

      - name: tinyml-modelzoo Tests
        working-directory: tinyml-modelzoo
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest tests/ -v --tb=short
          else
            echo "No tests found in tinyml-modelzoo/tests/ yet -- skipping."
          fi

      - name: torchmodelopt — Component Tests
        working-directory: tinyml-modeloptimization/torchmodelopt
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest tests/ -v --tb=short
          else
            echo "No tests found in tinyml-modeloptimization/torchmodelopt/tests/ yet -- skipping."
          fi
