common:
    target_module: 'timeseries'
    task_type: 'generic_timeseries_anomalydetection'
    target_device: 'F28P55'
    run_name: '{date-time}/{model_name}'

dataset:
    enable: True 
    dataset_name: generic_timeseries_anomalydetection
    input_data_path: https://software-dl.ti.com/C2000/esd/mcu_ai/datasets/generic_timeseries_anomalydetection.zip
    split_factor: [0.5, 0.1, 0.4]

data_processing_feature_extraction: 
    data_proc_transforms:
    - SimpleWindow
    - Downsample
    frame_size: 128
    sampling_rate: 100
    new_sr: 10
    variables: 1

training:
    model_name: AD_11k_NPU
    model_config: ''
    batch_size: 64
    training_epochs: 30
    num_gpus: 0
    quantization: 2
    auto_quantization: False
    output_int: False

testing:
    enable: True

compilation:
    enable: True 
