# Supplements for presets defined by the installed tinyml_modelmaker (its constants.py is the source of truth).
# Keeps only the human-readable text and defaults modelmaker leaves unset; never lists which presets exist.
presets:
  Generic_1024Input_FFTBIN_64Feature_8Frame: {description: FFT + binning to 64 bins across 8 frames. Good general-purpose preset for vibration and fault detection with 1024-sample frames., use_case: General purpose}
  Generic_512Input_FFTBIN_32Feature_8Frame: {description: FFT + binning to 32 bins across 8 frames. Smaller memory footprint than 1024-sample version., use_case: Smaller input}
  Generic_256Input_FFTBIN_16Feature_8Frame: {description: FFT + binning to 16 bins across 8 frames. Minimum memory footprint FFT preset., use_case: Minimum memory footprint}
  Generic_1024Input_FFT_512Feature_1Frame: {description: 'Full FFT spectrum (no binning), 512 features from a single 1024-sample frame. Higher resolution, larger model.', use_case: Full spectrum}
  Generic_512Input_FFT_256Feature_1Frame: {description: 'Full FFT spectrum (no binning), 256 features from a single 512-sample frame.', use_case: Full spectrum (smaller)}
  Generic_512Input_RAW_512Feature_1Frame: {description: 'Raw time-domain samples, no frequency transform. Use when waveform shape matters more than frequency content.', use_case: Raw waveform}
  Generic_256Input_RAW_256Feature_1Frame: {description: Raw time-domain samples (256 samples). Smaller raw preset., use_case: Raw waveform (smaller)}
  Generic_128Input_RAW_128Feature_1Frame: {description: Raw time-domain samples (128 samples). Minimum size raw preset., use_case: Raw waveform (minimum)}
  FFT1024Input_256Feature_1Frame_Full_Bandwidth: {description: Full-bandwidth FFT for arc fault detection. 256 bins across the full spectrum from a 1024-sample frame., use_case: Arc fault detection, stacking: 2D1}
  Input256_FFTBIN_16Feature_8Frame_3InputChannel_removeDC_2D1: {description: 'Motor fault preset for 3-axis accelerometer (3 channels). FFT + 16-bin binning × 8 frames per channel, 2D stacking.', use_case: Motor bearing fault}
  Input256_FFT_128Feature_1Frame_3InputChannel_removeDC_2D1: {description: 'Motor fault preset for 3-axis accelerometer, full FFT (no binning). Higher frequency resolution.', use_case: Motor bearing fault (full FFT)}
  Input128_RAW_128Feature_1Frame_3InputChannel_removeDC_2D1: {description: Raw time-domain preset for 3-axis accelerometer. No frequency transform., use_case: Motor bearing fault (raw)}
  PIRDetection_125Input_25Feature_25Frame_1InputChannel_2D: {description: Specialized preset for PIR motion detection sensors (25 windows x 25 features per sample)., use_case: PIR motion detection}
  Custom_Default: {description: No feature extraction — raw windowed data is fed directly to the model. User defines frame_size via data_proc_transforms., use_case: Custom pipeline}
  Custom_Default_MSPM0: {description: Custom Q15 fixed-point feature extraction for MSPM0 embedded MCU., use_case: MSPM0 embedded MCU}
  Custom_MotorFault: {description: Custom pipeline for motor fault detection with 3-axis accelerometer (no feature extraction)., use_case: Motor bearing fault (custom)}
  Custom_MotorFault_MSPM0: {description: Motor fault preset for MSPM0 MCU with 3-axis accelerometer using Q15 fixed-point arithmetic., use_case: Motor bearing fault (MSPM0), frame_size: 256, feature_size_per_frame: 16, num_frame_concat: 8, stacking: 2D1}
  Custom_ArcFault: {description: Custom arc fault detection preset using full-bandwidth FFT with windowing., use_case: Arc fault detection (custom), frame_size: 1024, feature_size_per_frame: 256, num_frame_concat: 1, stacking: 2D1}
  Custom_ArcFault_MSPM0: {description: Arc fault detection for MSPM0 MCU using Q15 fixed-point FFT., use_case: Arc fault detection (MSPM0), frame_size: 1024, feature_size_per_frame: 128, num_frame_concat: 8, stacking: 2D1}
  FFT1024Input_256Feature_1Frame_Half_Bandwidth: {description: 'Full FFT spectrum (half-bandwidth), 256 features. Focuses on lower frequency content.', use_case: Arc fault detection (half bandwidth), stacking: 2D1}
  FFT1024Input_64Feature_4Frame_Half_Bandwidth: {description: FFT + binning to 64 bins across 4 frames (half-bandwidth). Low memory footprint., use_case: 'Arc fault detection (binned, half bandwidth)', stacking: 2D1}
  FFT1024Input_32Feature_8Frame_Quarter_Bandwidth: {description: FFT + binning to 32 bins across 8 frames (quarter-bandwidth). Minimal memory usage., use_case: Arc fault detection (minimal footprint), stacking: 2D1}
  FFT256Input_FE_RFFT_16Feature_8Frame_removeDC_Full_Bandwidth: {description: 'Q15 fixed-point FFT with 16 bins across 8 frames, DC removal, full-bandwidth.', use_case: 'Generic timeseries (Q15, low memory)', stacking: 2D1}
  Generic_256Input_FFT_128Feature_1Frame: {description: Full FFT spectrum (128 features) from 256-sample frame. Higher frequency resolution., use_case: Generic timeseries (full spectrum)}
  ArcFault_1024Input_256Feature_1Frame_Full_Bandwidth: {description: 'Arc fault preset with full-bandwidth FFT, 256 features from 1024-sample frame.', use_case: Arc fault detection (full spectrum), stacking: 2D1}
  ArcFault_1024Input_256Feature_1Frame_Half_Bandwidth: {description: Arc fault preset focused on lower frequencies (half-bandwidth)., use_case: Arc fault detection (half bandwidth), stacking: 2D1}
  ArcFault_1024Input_64Feature_4Frame_Half_Bandwidth: {description: 'Arc fault preset with 64-bin binning across 4 frames, half-bandwidth, reduced memory.', use_case: 'Arc fault detection (binned, half bandwidth)', stacking: 2D1}
  ArcFault_1024Input_32Feature_8Frame_Quarter_Bandwidth: {description: 'Arc fault preset with minimal footprint: 32-bin binning, 8 frames, quarter-bandwidth.', use_case: Arc fault detection (minimal footprint), stacking: 2D1}
  ArcFault_1024Input_FE_RFFT_128Feature_8Frame_1InputChannel_removeDC_Full_Bandwidth: {description: 'Arc fault Q15 fixed-point preset with 128 bins across 8 frames, DC removal.', use_case: 'Arc fault detection (Q15, full bandwidth)', stacking: 2D1}
  ArcFault_512Input_FE_RFFT_32Feature_8Frame_1InputChannel_removeDC_Full_Bandwidth: {description: 'Arc fault Q15 fixed-point preset with 512-sample frames, 32 bins, 8-frame concat.', use_case: 'Arc fault detection (Q15, low memory)', stacking: 2D1}
  Input256_FFTBIN_16Feature_8Frame_3InputChannel_removeDC_1D: {description: Motor fault preset for 3-axis accelerometer with 1D stacking (flat concatenation)., use_case: Motor bearing fault (1D stacking)}
  MotorFault_256Input_FE_RFFT_16Feature_8Frame_3InputChannel_removeDC_2D1: {description: Motor fault Q15 fixed-point preset for 3-axis accelerometer with 2D1 stacking., use_case: Motor bearing fault (Q15)}
  ECG2500Input_Roundoff_1Frame: {description: ECG preset with 2500-sample frames and rounding-off transform for normalization., use_case: ECG classification}
  PIRDetection_125Input_25Feature_25Frame_1InputChannel_2D_FixedPoint: {description: PIR motion detection preset using fixed-point arithmetic (MSPM0). Expects 8-bit unsigned input., use_case: PIR motion detection (fixed-point)}
  HandGesture256Input_RangeNormalize_1Frame: {description: 'Hand-gesture preset: no feature extraction; data is divided by scale=4096 and cut into 256-row windows with SimpleWindow (stride 0.25). 3 channels.', use_case: Hand gesture recognition}
  FallDetection_256Input_FE_RFFT_8Feature_8Frame_3InputChannel_removeDC_2D1: {description: 'Fall-detection Q15 fixed-point preset for a 3-axis sensor on MSPM0 (8 bins x 8 frames).', use_case: Fall detection (Q15)}
  WiFiCSI_128Input_L2Norm2DFFT_64x26Feature_1Frame_52Subcarriers: {description: 'WiFi CSI preset: L2 row norm, FFT over time then across the 52 subcarriers (FFT_COL), 128-row frames downsampled 128->64 Hz. Needs exactly 52 data columns. Training only: no device library support found.', use_case: WiFi CSI presence detection}
  Generic_8Input_ABS_8Feature_1Frame: {description: 'Magnitude + log of 8-sample frames for many-channel regression (11 variables).', use_case: Generic regression}

transforms:
  FFT_FE:
    description: "Compute Fast Fourier Transform of the windowed signal."
    category: feature_extraction
    parameters: []

  FFT_POS_HALF:
    description: "Keep only the positive-frequency half of the FFT output (real signals are symmetric)."
    category: feature_extraction
    parameters: []

  FFT_Q15:
    description: "Fixed-point Q15 FFT for on-device MCU inference."
    category: feature_extraction_q15
    parameters: []

  WINDOWING:
    description: "Multiply each frame by a Hann window (the only window implemented) before the FFT to reduce spectral leakage. Device Hann tables exist for frame sizes 32-1024."
    category: feature_extraction
    parameters: []

  ABS:
    description: "Take the absolute value (magnitude) of complex FFT output."
    category: feature_extraction
    parameters: []

  BINNING:
    description: "Group frequency bins to reduce feature count while preserving spectral shape."
    category: feature_extraction
    parameters: []

  BIN_Q15:
    description: "Q15 fixed-point binning with optional normalization."
    category: feature_extraction_q15
    parameters: []

  NORMALIZE:
    description: "Divide every value of the frame by frame_size (scales an FFT magnitude to be frame-size independent). It is NOT zero-mean/unit-variance normalisation."
    category: feature_extraction
    parameters: []

  LOG_DB:
    description: "Convert magnitude spectrum to logarithmic (dB) scale, compressing dynamic range."
    category: feature_extraction
    parameters: []

  DC_REMOVE:
    description: "Drop the first element (bin 0, the DC term) of the spectrum, x[1:], reducing the feature length by 1. Use it after FFT_POS_HALF/ABS (or Q15_MAG); it does not touch the time signal. Unrelated to the dc_remove key, which only affects RAW_FE."
    category: feature_extraction
    parameters: []

  CONCAT:
    description: "Concatenate features across multiple frames into the final feature vector."
    category: feature_extraction
    parameters: []

  RAW_FE:
    description: "Use the raw time-domain frame as the feature vector (length frame_size); subtracts the frame mean when dc_remove is True (the default; the device always subtracts it)."
    category: feature_extraction
    parameters: []

  TO_Q15:
    description: "Convert floating-point to fixed-point Q15 format with saturation."
    category: feature_extraction_q15
    parameters: []

  Q15_SCALE:
    description: "Q15 bit-shift scaling (amplify or attenuate)."
    category: feature_extraction_q15
    parameters: []

  Q15_MAG:
    description: "Q15 magnitude of complex FFT output."
    category: feature_extraction_q15
    parameters: []

  PIR_FE:
    description: "Specialized feature extraction for PIR motion detection sensors."
    category: feature_extraction
    parameters: []

  L2_NORM_ROW:
    description: "Normalise each time step across all variables to unit L2 norm (multi-column data such as WiFi CSI). Python only: no device library support found."
    category: feature_extraction
    parameters: []

  FFT_COL:
    description: "After CONCAT, take an FFT across the variables axis per window; channels become variables//2. Needs variables >= 2 (WiFi CSI). Python only: no device library support found."
    category: feature_extraction
    parameters: []

  KURT_FE:
    description: "Kurtosis of chunks of a window. Building block of PIR_FE; invalid on its own."
    category: feature_extraction
    standalone: false
    parameters: []

  ENT_FE:
    description: "Spectral entropy of a window. Building block of PIR_FE; invalid on its own."
    category: feature_extraction
    standalone: false
    parameters: []

  ZCR_FE:
    description: "Zero-crossing rate of a window. Building block of PIR_FE; invalid on its own."
    category: feature_extraction
    standalone: false
    parameters: []

  DOM_FE:
    description: "Two dominant FFT frequencies of a window. Building block of PIR_FE; invalid on its own."
    category: feature_extraction
    standalone: false
    parameters: []

  SLOPE_FE:
    description: "Slope-sign changes of a window. Building block of PIR_FE; invalid on its own."
    category: feature_extraction
    standalone: false
    parameters: []

  PIR_FE_Q15:
    description: "Specialized Q15 fixed-point feature extraction for PIR motion detection sensors."
    category: feature_extraction_q15
    parameters: []

  ROUND_OFF:
    description: "Round-off transform to normalize and discretize signal values."
    category: feature_extraction
    parameters: []

  SimpleWindow:
    description: "Cut each file into windows of frame_size rows with stride int(frame_size*stride_size) rows (stride_size is the step as a FRACTION of the window: 0.25 = 75% overlap, 1.0 = none; a step that rounds to 0 becomes frame_size). With feature extraction the windows are re-framed afterwards; without it each window is a model input."
    category: data_proc
    parameters:
      - name: frame_size
        type: int
        required: true
      - name: stride_size
        type: float
        required: false

  Downsample:
    description: "Keep every k-th row, k = int(sampling_rate // new_sr), reducing the rate (rows become ceil(rows/k)). Exact spelling is 'Downsample': 'DownSample' is silently ignored. Needs new_sr <= sampling_rate; use an integer ratio."
    category: data_proc
    parameters:
      - name: sampling_rate
        type: int
        required: true
      - name: new_sr
        type: int
        required: true

augmenters:
  AddNoise:
    file: add_noise.py
    description: "Adds random noise (Gaussian/Laplace/uniform) to training samples for robustness."

  Crop:
    file: crop.py
    description: "Randomly crop sub-sequences to increase dataset variety."

  Drift:
    file: drift.py
    description: "Add smooth cubic-spline baseline drift, simulating sensor drift."

  Dropout:
    file: dropout.py
    description: "Randomly zero-out time points, simulating missing data."

  TimeWarp:
    file: time_warp.py
    description: "Randomly warp the time axis (speeds up/slows down), useful for activity recognition."

  Pool:
    file: pool.py
    description: "Apply max/min/average pooling to reduce temporal resolution without changing output length."

  Quantize:
    file: quantize.py
    description: "Quantize signal to discrete levels using uniform/quantile/kmeans methods."

  Resize:
    file: resize.py
    description: "Resample the time series to a new length via linear interpolation."

  Reverse:
    file: reverse.py
    description: "Reverse the time axis of the sequence."

  Convolve:
    file: convolve.py
    description: "Apply convolution with a kernel."

task_recommendations:
  generic_timeseries_forecasting:
    required_data_proc: [SimpleWindow]
    required_reason: "SimpleWindow is mandatory for forecasting — it creates the input window (frame_size samples) and the forecast horizon (future target values)."
    optional_data_proc: [Downsample]
    notes: "Set frame_size to the number of historical time steps the model looks back. Set forecast_horizon to the number of future steps to predict. Specify target_variables for which column(s) to forecast."

  motor_fault:
    required_data_proc: []
    optional_data_proc: [SimpleWindow, Downsample]
    recommended_presets:
      - Input256_FFTBIN_16Feature_8Frame_3InputChannel_removeDC_2D1
      - Input256_FFT_128Feature_1Frame_3InputChannel_removeDC_2D1
      - Input128_RAW_128Feature_1Frame_3InputChannel_removeDC_2D1
    preset_reason: "Motor fault data is typically high-frequency vibration from accelerometers. FFT-based presets capture fault-related frequency signatures."
    notes: "3-axis accelerometer data uses variables=3. For single-axis, use Generic_* presets."

  arc_fault:
    required_data_proc: []
    optional_data_proc: [Downsample]
    recommended_presets:
      - FFT1024Input_256Feature_1Frame_Full_Bandwidth
    preset_reason: "Arc fault detection relies on high-frequency content across the full bandwidth. Full-spectrum FFT captures arc signatures."
    notes: "Original sampling rate is typically 313 kHz, often downsampled to ~3130 Hz."

  pir_detection:
    required_data_proc: []
    optional_data_proc: []
    recommended_presets: [PIRDetection_125Input_25Feature_25Frame_1InputChannel_2D]
    preset_reason: "Specialized PIR feature extraction that captures motion patterns from passive infrared sensors."
    notes: "PIR sensors have a fixed sampling rate (~33 Hz) and specialized feature pipeline."

  ecg_classification:
    required_data_proc: [SimpleWindow]
    required_reason: "ECG data is a continuous time series that must be segmented into fixed-length windows for beat-level classification."
    optional_data_proc: [Downsample]
    recommended_presets: [ECG2500Input_Roundoff_1Frame]
    preset_reason: "ECG classification often benefits from raw waveform shape analysis rather than frequency decomposition."
    notes: "Typical ECG sampling rates are 250-500 Hz. Frame size should cover 1-2 heartbeat cycles."


stacking_modes:
  2D1:
    description: "One channel per variable: model input (V, features_per_frame*num_frame_concat, 1). Preserves per-channel structure for convolutional models."
  1D:
    description: "All variables laid end to end in a single channel: model input (1, features_per_frame*num_frame_concat*V, 1)."
