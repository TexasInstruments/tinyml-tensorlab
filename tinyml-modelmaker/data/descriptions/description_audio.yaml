preset_descriptions:
  MSPM0G5187:
    audio_classification:
      compress_npu_layer_data:
        compilation:
          cross_compiler: /opt/tinyml/code/tinyml-mlbackend/tinyml_proprietary_models/tiarmclang
          cross_compiler_options: -Os -mcpu=cortex-m0plus -march=thumbv6m -mtune=cortex-m0plus
            -mthumb -mfloat-abi=soft -I. -Wno-return-type
          target: c, ti-npu skip_normalize=true output_int=true opt_for_space=true
          target_c_mcpu: cortex-m0plus
      default_preset:
        compilation:
          cross_compiler: /opt/tinyml/code/tinyml-mlbackend/tinyml_proprietary_models/tiarmclang
          cross_compiler_options: -Os -mcpu=cortex-m0plus -march=thumbv6m -mtune=cortex-m0plus
            -mthumb -mfloat-abi=soft -I. -Wno-return-type
          target: c, ti-npu skip_normalize=true output_int=true
          target_c_mcpu: cortex-m0plus
      forced_soft_npu_preset:
        compilation:
          cross_compiler: /opt/tinyml/code/tinyml-mlbackend/tinyml_proprietary_models/tiarmclang
          cross_compiler_options: -Os -mcpu=cortex-m0plus -march=thumbv6m -mtune=cortex-m0plus
            -mthumb -mfloat-abi=soft -I. -Wno-return-type
          target: c, ti-npu type=soft skip_normalize=true output_int=true
          target_c_mcpu: cortex-m0plus
sample_dataset_descriptions:
  cough_detection:
    common:
      task_category: audio_classification
      task_type: audio_classification
    dataset:
      dataset_name: cough_detection
      input_data_path: https://software-dl.ti.com/C2000/esd/mcu_ai/datasets/cough_detection.zip
    info:
      dataset_description: Binary audio classification dataset (cough vs other) captured
        with TI EdgeAI Studio via the LP-MSPM0G5187 I2S peripheral at 8820 Hz. Cough
        clips are augmented with attenuated, noise-mixed copies so the model discriminates
        on spectral shape rather than loudness.
      dataset_detailed_name: Cough Detection
      dataset_license: TI Internal License
      dataset_size: '2 classes: cough, other. 2-second WAV clips at 8820 Hz.'
      dataset_source: Generated by Texas Instruments using TI EdgeAI Studio
      dataset_url: https://software-dl.ti.com/C2000/esd/mcu_ai/datasets/cough_detection.zip
  glass_break_detection:
    common:
      task_category: audio_classification
      task_type: audio_classification
    dataset:
      dataset_name: glass_break_detection
      input_data_path: https://software-dl.ti.com/C2000/esd/mcu_ai/datasets/glass_break_detection.zip
    info:
      dataset_description: Binary audio classification dataset (glass_break vs other)
        for detecting the sound of breaking glass.
      dataset_detailed_name: Glass Break Detection
      dataset_license: TI Internal License
      dataset_size: null
      dataset_source: Generated by Texas Instruments
      dataset_url: https://software-dl.ti.com/C2000/esd/mcu_ai/datasets/glass_break_detection.zip
  google_speech_commands_12class:
    common:
      task_category: audio_classification
      task_type: audio_classification
    dataset:
      dataset_name: google_speech_commands_12class
      input_data_path: https://software-dl.ti.com/C2000/esd/mcu_ai/datasets/google_speech_commands_12class.zip
    info:
      dataset_citation: 'Warden, P. Speech Commands: A Dataset for Limited-Vocabulary
        Speech Recognition. arXiv:1804.03209, 2018.'
      dataset_description: 'The Google Speech Commands 12-class dataset is a TensorLab-compatible
        keyword spotting dataset generated from Google Speech Commands v0.02 using
        TorchAudio. It contains 10 selected command classes: down, go, left, no, off,
        on, right, stop, up, and yes. All remaining spoken-word classes are mapped
        into _unknown_, and _silence_ samples are generated from the original _background_noise_
        audio files. The dataset is arranged in class-folder format for audio classification
        workflows.'
      dataset_detailed_name: Google Speech Commands Classification
      dataset_license: Refer to the original Google Speech Commands dataset license
        and usage terms.
      dataset_size: '12 classes: 10 keyword classes, 1 _unknown_ class, and 1 _silence_
        class. Each sample is a 1-second 16 kHz WAV audio clip.'
      dataset_source: Derived from Google Speech Commands v0.02 downloaded using torchaudio.datasets.SPEECHCOMMANDS.
      dataset_url: https://pytorch.org/audio/stable/generated/torchaudio.datasets.SPEECHCOMMANDS.html
  wake_word_detection:
    common:
      task_category: audio_classification
      task_type: audio_classification
    dataset:
      dataset_name: wake_word_detection
      input_data_path: https://software-dl.ti.com/C2000/esd/mcu_ai/datasets/wake_word_detection.zip
    info:
      dataset_description: Binary audio classification dataset (ok_kilby vs other).
        Wake word used for training is "Ok Kilby"
      dataset_detailed_name: Wake Word Detection
      dataset_license: TI Internal License
      dataset_size: null
      dataset_source: Generated by Texas Instruments
      dataset_url: https://software-dl.ti.com/C2000/esd/mcu_ai/datasets/wake_word_detection.zip
