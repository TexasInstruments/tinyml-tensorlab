sample_dataset_descriptions:
  coffee_bean_classification:
    common:
      task_category: image_classification
      task_type: image_classification
    dataset:
      dataset_name: coffee_bean_classification
      input_data_path: https://software-dl.ti.com/C2000/esd/mcu_ai/datasets/coffee_bean_classification.zip
    info:
      dataset_citation: Coffee Bean Dataset Resized (224 X 224), Kaggle. https://www.kaggle.com/datasets/gpiosenka/coffee-bean-dataset-resized-224-x-224
      dataset_description: The Coffee Bean dataset is an image classification dataset
        containing coffee bean images grouped into roast/bean categories such as Dark,
        Green, Light, and Medium. It can be used to train and evaluate image classification
        models that distinguish coffee bean roast levels using visual cues such as
        color, texture, and surface appearance.
      dataset_detailed_name: Coffee Bean Dataset Resized 224x224
      dataset_license: Refer to the dataset page for the latest license/usage terms.
      dataset_size: 'Four classes: Dark, Green, Light, and Medium. Images are resized
        to 224x224 in the original dataset source.'
      dataset_source: Kaggle dataset published as Coffee Bean Dataset Resized (224
        X 224)
      dataset_url: https://www.kaggle.com/datasets/gpiosenka/coffee-bean-dataset-resized-224-x-224
  machine_readable_code_classification:
    common:
      task_category: image_classification
      task_type: image_classification
    dataset:
      dataset_name: machine_readable_code_classification
      input_data_path: https://software-dl.ti.com/C2000/esd/mcu_ai/datasets/machine_readable_code_classification.zip
    info:
      dataset_description: 'The Machine Readable Code dataset is a synthetic low-resolution
        image classification dataset created for tiny image classification experiments.
        It contains three classes: QR code, barcode, and other/non-code images. QR
        images are generated using random alphanumeric payloads, barcode images are
        generated as Code128 barcodes without printed text, and the other class contains
        blank, noise, line, and block-pattern images. All images are converted to
        28x28 grayscale binary PNGs.'
      dataset_detailed_name: Synthetic Machine Readable Code 28x28 Dataset
      dataset_size: 3,000 images per class, 9,000 images total. Each image is 28x28
        grayscale binary.
      dataset_source: Generated synthetically using Python packages qrcode, python-barcode,
        Pillow, and NumPy.
      dataset_url: Generated locally using the repository dataset generation script.
  mnist_classes:
    common:
      task_category: image_classification
      task_type: image_classification
    dataset:
      dataset_name: mnist_classes
      input_data_path: https://software-dl.ti.com/C2000/esd/mcu_ai/datasets/mnist_classes.zip
    info:
      dataset_citation: Yann LeCun, Corinna Cortes, and Christopher J.C. Burges. "The
        MNIST Database of Handwritten Digits." 1998. http://yann.lecun.com/exdb/mnist/
      dataset_description: MNIST dataset with handwritten digit images (0-9) organized
        as class folders for image classification workflows. Standard 28x28 grayscale
        images used for image classification training and evaluation.
      dataset_detailed_name: MNIST Handwritten Digits Classification
      dataset_license: Freely available for research and educational purposes
      dataset_size: Multiple classes of handwritten digit images (28x28 grayscale)
      dataset_source: Created by Yann LeCun, Corinna Cortes, and Christopher J.C.
        Burges from NIST data
      dataset_url: http://yann.lecun.com/exdb/mnist/
  mnist_image_classification:
    common:
      task_category: image_classification
      task_type: image_classification
    dataset:
      dataset_name: mnist_image_classification
      input_data_path: https://software-dl.ti.com/C2000/esd/mcu_ai/datasets/mnist_classes.zip
    info:
      dataset_citation: Yann LeCun, Corinna Cortes, and Christopher J.C. Burges. "The
        MNIST Database of Handwritten Digits." 1998. http://yann.lecun.com/exdb/mnist/
      dataset_description: "The MNIST dataset is a large database of handwritten digits\
        \ (0\u20139) commonly used for training and testing in the field of machine\
        \ learning. It consists of 60,000 training images and 10,000 test images,\
        \ each 28x28 grayscale. MNIST was created by Yann LeCun, Corinna Cortes, and\
        \ Christopher J.C. Burges as a benchmark for image classification research."
      dataset_detailed_name: Modified National Institute of Standards and Technology
        (MNIST) Database
      dataset_license: Freely available for research and educational purposes
      dataset_size: 60,000 training images, 10,000 test images (28x28 grayscale)
      dataset_source: Created by Yann LeCun, Corinna Cortes, and Christopher J.C.
        Burges from NIST data
      dataset_url: http://yann.lecun.com/exdb/mnist/
