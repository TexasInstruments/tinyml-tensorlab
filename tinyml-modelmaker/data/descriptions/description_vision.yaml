preset_descriptions:
  AM13E2:
    image_classification:
      compress_npu_layer_data:
        compilation:
          cross_compiler: /opt/tinyml/code/tinyml-mlbackend/tinyml_proprietary_models/tiarmclang
          cross_compiler_options: -Os -mcpu=cortex-m0plus -march=thumbv6m -mtune=cortex-m0plus
            -mthumb -mfloat-abi=soft -I. -Wno-return-type
          target: c, ti-npu skip_normalize=true output_int=true opt_for_space=true
          target_c_mcpu: cortex-m0plus
      default_preset:
        compilation:
          cross_compiler: /opt/tinyml/code/tinyml-mlbackend/tinyml_proprietary_models/tiarmclang
          cross_compiler_options: -Os -mcpu=cortex-m0plus -march=thumbv6m -mtune=cortex-m0plus
            -mthumb -mfloat-abi=soft -I. -Wno-return-type
          target: c, ti-npu skip_normalize=true output_int=true
          target_c_mcpu: cortex-m0plus
      forced_soft_npu_preset:
        compilation:
          cross_compiler: /opt/tinyml/code/tinyml-mlbackend/tinyml_proprietary_models/tiarmclang
          cross_compiler_options: -Os -mcpu=cortex-m0plus -march=thumbv6m -mtune=cortex-m0plus
            -mthumb -mfloat-abi=soft -I. -Wno-return-type
          target: c, ti-npu type=soft skip_normalize=true output_int=true
          target_c_mcpu: cortex-m0plus
