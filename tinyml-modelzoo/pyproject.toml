[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyml_modelzoo"
version = "1.5.0"
description = "TI's TinyML Model Zoo - Centralized model definitions for microcontrollers"
readme = "README.md"
requires-python = ">=3.10,<3.15"
classifiers = [

    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "artificial intelligence",
    "deep learning",
    "tinyml",
    "microcontrollers",
    "model zoo",
]
dependencies = [
    "torch==2.11.0",
    "PyYAML==6.0.3",
    # numpy dropped cp310 wheels at 2.3.0; pin per-interpreter rather than a
    # range so both targets stay on a version verified to have a real wheel.
    "numpy==2.2.6 ; python_version < '3.11'",
    "numpy==2.5.2 ; python_version >= '3.11'",
    # Pulls in tinyverse + torchmodelopt transitively. Hosted on TI's official
    # CDN (same host modelmaker/tinyverse use for their own sibling deps) -
    # modelzoo installs itself editable, so this must NOT also depend on modelzoo.
    "tinyml_modelmaker @ https://software-dl.ti.com/C2000/esd/mcu_ai/wheel/tinyml_modelmaker-1.5.0-py3-none-any.whl",
]

[[project.authors]]
name = "Texas Instruments"
email = "thonse@ti.com"

[project.license]
text = "BSD 3-Clause"

[project.urls]
Homepage = "https://github.com/TexasInstruments/tinyml-tensorlab/tree/main/tinyml-modelzoo"
"Bug Reports" = "https://e2e.ti.com/support/processors/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tinyml_modelzoo*"]
exclude = ["tests*"]
