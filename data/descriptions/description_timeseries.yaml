preset_descriptions:
  AM13E2:
    arc_fault:
      compress_npu_layer_data:
        compilation:
          cross_compiler: /opt/tinyml/code/tinyml-mlbackend/tinyml_proprietary_models/tiarmclang
          cross_compiler_options: -DARM_CPU_INTRINSICS_EXIST -mcpu=cortex-m33 -mfloat-abi=hard
            -mfpu=fpv5-sp-d16 -mlittle-endian -O3 -I. -Wno-return-type -march=thumbv8.1-m.main+cdecp0
          target: c, ti-npu skip_normalize=true output_int=true opt_for_space=true
          target_c_mcpu: cortex-m33
      default_preset:
        compilation:
          cross_compiler: /opt/tinyml/code/tinyml-mlbackend/tinyml_proprietary_models/tiarmclang
          cross_compiler_options: -DARM_CPU_INTRINSICS_EXIST -mcpu=cortex-m33 -mfloat-abi=hard
            -mfpu=fpv5-sp-d16 -mlittle-endian -O3 -I. -Wno-return-type -march=thumbv8.1-m.main+cdecp0
          target: c, ti-npu type=hard skip_normalize=true output_int=true
          target_c_mcpu: cortex-m33
      forced_soft_npu_preset:
        compilation:
          cross_compiler: /opt/tinyml/code/tinyml-mlbackend/tinyml_proprietary_models/tiarmclang
          cross_compiler_options: -DARM_CPU_INTRINSICS_EXIST -mcpu=cortex-m33 -mfloat-abi=hard
            -mfpu=fpv5-sp-d16 -mlittle-endian -O3 -I. -Wno-return-type -march=thumbv8.1-m.main+cdecp0
          target: c, ti-npu type=soft skip_normalize=true output_int=true
          target_c_mcpu: cortex-m33
    blower_imbalance:
      compress_npu_layer_data:
        compilation:
