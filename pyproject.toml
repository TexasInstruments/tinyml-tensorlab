[build-system]
requires = [ "setuptools",
	"wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "tinyml_tinyverse"
version = "1.5.0"
description = "A tiny machine learning project in the tinyverse"
readme = "README.md"
requires-python = ">=3.10,<3.15"
classifiers = [
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.14",]
keywords = [ "artificial intelligence",
	"deep learning",
	"image classification",
	"visual wake words",
	"time series classification",
	"audio classification",
	"keyword spotting",]
dependencies = [
	# pandas, scipy, matplotlib, scikit-learn, PyWavelets, and cmsisdsp all
	# dropped (or never had, for cmsisdsp) cp310 wheels in the version that
	# has cp314 wheels - pinned per-interpreter rather than a range so both
	# targets stay on a version verified to have a real wheel.
	# torch, numpy, onnx, onnxruntime, colorama are not pinned here - they're
	# pinned in tinyml_torchmodelopt, which is a mandatory dependency below,
	# so re-pinning the same versions here would just be a second place to
	# keep in sync.
	# torch>=2.x's default ONNX exporter (torch.onnx.export -> torch.onnx._internal.exporter)
	# imports onnxscript at call time; not needed by the old exporter path torch 2.7.1 used.
	"onnxscript==0.7.1",
	"pandas==2.3.3 ; python_version < '3.11'",
	"pandas==3.0.5 ; python_version >= '3.11'",
	"PyYAML==6.0.3",
	"scipy==1.15.3 ; python_version < '3.11'",
	"scipy==1.18.1 ; python_version >= '3.11'",
	"tabulate==0.10.0",
	"torcheval==0.0.7",
	"torchinfo==1.8.0",
	"cryptography==50.0.1",
	"matplotlib==3.10.9 ; python_version < '3.11'",
	"matplotlib==3.11.1 ; python_version >= '3.11'",
	"scikit-learn==1.7.2 ; python_version < '3.11'",
	"scikit-learn==1.9.0 ; python_version >= '3.11'",
	"torchaudio==2.11.0",
	# cmsisdsp: no version ships wheels for both cp310 and cp314. 1.10.1 has
	# a cp310 wheel; 1.10.3 has no wheel at all (any interpreter) but builds
	# cleanly from its sdist, which is what happens under 3.14 here.
	"cmsisdsp==1.10.1 ; python_version < '3.11'",
	"cmsisdsp==1.10.3 ; python_version >= '3.11'",
	"torchvision==0.26.0",
	"opencv-python==5.0.0.93",
	"soundfile==0.14.0",
	# Loose constraint, not a URL pin: modelzoo is normally installed editable
	# from a local clone (it's the actively-edited repo), and a URL-pinned
	# requirement here would conflict with that - pip treats an editable
	# install and a URL-pinned wheel as different, incompatible providers of
	# the same package name and refuses to resolve.
	"tinyml_modelzoo>=1.5.0",
	"tinyml_torchmodelopt @ https://software-dl.ti.com/C2000/esd/mcu_ai/wheel/tinyml_torchmodelopt-1.5.0-py3-none-any.whl",
	# ti_mcu_nnc is cp310-only upstream (confirmed via HTTP 404 for a cp314
	# build), so the marker just makes it absent under 3.14 - no wheel
	# candidate matches, pip skips it silently, no extras flag needed.
	"ti_mcu_nnc @ https://software-dl.ti.com/mctools/esd/tvm/mcu/ti_mcu_nnc-2.1.2-cp310-cp310-linux_x86_64.whl ; platform_system == 'Linux' and python_version < '3.11'",
	"ti_mcu_nnc @ https://software-dl.ti.com/mctools/esd/tvm/mcu/ti_mcu_nnc-2.1.2-cp310-cp310-win_amd64.whl ; platform_system == 'Windows' and python_version < '3.11'",
	"ti_mcu_nnc @ https://software-dl.ti.com/mctools/esd/tvm/mcu/ti_mcu_nnc-2.1.2-cp310-cp310-macosx_14_0_arm64.whl ; platform_system == 'Darwin' and python_version < '3.11'",
	"PyWavelets==1.8.0 ; python_version < '3.11'",
	"PyWavelets==1.9.0 ; python_version >= '3.11'",
	"onnx-graphsurgeon==0.6.1",
	# colorama is pinned in tinyml_torchmodelopt (mandatory dependency above).
]

[[project.authors]]
name = "Adithya Thonse"
email = "thonse@ti.com"

[project.license]
text = "BSD 3-Clause"

[project.urls]
Homepage = "https://github.com/TexasInstruments/tinyml-tensorlab/tree/main/tinyml-tinyverse"
"Bug Reports" = "https://e2e.ti.com/support/processors/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [ "tinyml_tinyverse*",]
exclude = [ "tests*",]

[tool.setuptools.package-data]
# fel_memory is a resource tree (device driverlib headers, .c sources, .a libs
# used to compile a throwaway binary just to read its memory map) nested inside
# the references.common package, not a package itself - setuptools won't pick
# up non-.py files under it automatically, and there's no MANIFEST.in either.
"tinyml_tinyverse.references.common" = [ "fel_memory/**/*",]
